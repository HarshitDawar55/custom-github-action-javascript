name: 'Test Custom Action'
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Run custom action
        uses: HarshitDawar55/custom-github-action-javascript@v0.0.1
        with:
          name: 'Harshit Dawar'
      - name: Display output
        run: echo "Greeting: ${{ steps.test.outputs.greeting }}"